# mcp-server example config

defaults:
  max_rows: 100
  query_timeout: 30s

databases:
  default:
    driver: mysql
    host: 127.0.0.1
    port: 3306
    database: app
    username: app
    password: changeme
    charset: utf8mb4
    collation: utf8mb4_unicode_ci
    timezone: UTC
    mode: rw
    params:
      parseTime: "true"
    pool:
      max_connections: 10
      min_connections: 2
      connect_timeout: 10s
      max_idle_time: 60s

  reporting:
    driver: mysql
    host: 127.0.0.1
    port: 3306
    database: app
    username: ro
    password: ro_changeme
    mode: r
    pool:
      max_connections: 5
      min_connections: 1

redis:
  redis:
    host: 127.0.0.1
    port: 6379
    auth: changeme
    index: 0
    dial_timeout: 5s
    read_timeout: 5s

  hw_redis:
    host: 127.0.0.1
    port: 6379
    auth: changeme
    index: 6
    dial_timeout: 5s
    read_timeout: 5s

# Optional Apipost integration.
# If omitted, apipost_* tools will not be registered.
